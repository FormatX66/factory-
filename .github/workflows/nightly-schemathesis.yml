name: Nightly Schemathesis
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  # Exercise the changed validation jobs on the review branch before merge.
  pull_request:
    branches: ["release/v3.8.51"]
    paths:
      - ".github/workflows/nightly-schemathesis.yml"

permissions:
  contents: read

jobs:
  schemathesis:
    name: Schemathesis — OpenAPI contract fuzz (advisory)
    # Keep the operator's VPS selection; hosted fallback uses bounded webpack builds.
    runs-on: ${{ (github.event_name != 'pull_request' && vars.USE_VPS_RUNNER == 'true' && fromJSON('["self-hosted","omni-light"]')) || 'ubuntu-latest' }}
    timeout-minutes: 30
    # Bounded V8 heap + documented webpack fallback; native Turbopack allocations
    # are not limited by --max-old-space-size. This is a mitigation, not OOM proof.
    env:
      OMNIROUTE_USE_TURBOPACK: "0"
      OMNIROUTE_BUILD_MEMORY_MB: "8192"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - name: Runner diagnostics
        shell: bash
        run: |
          echo "runner=${{ runner.name }} environment=${{ runner.environment }} os=${{ runner.os }} arch=${{ runner.arch }}"
          echo "sha=$GITHUB_SHA run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
          free -m
          df -h .
          for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events; do
            if [ -r "$f" ]; then echo "$f"; cat "$f"; fi
          done
      - name: Build CLI bundle
        env:
          JWT_SECRET: ci-build-secret-with-sufficient-length-for-validation
          OMNIROUTE_BUILD_BACKEND_ONLY: "1"
        shell: bash
        run: |
          # Stream resource evidence before a VM shutdown can prevent artifact upload.
          (
            while true; do
              date -u
              free -m
              df -h .
              ps -eo pid,ppid,rss,comm --sort=-rss | head -n 12 || true
              if [ -r /sys/fs/cgroup/memory.events ]; then cat /sys/fs/cgroup/memory.events; fi
              sleep 30
            done
          ) > >(tee -a runner-resources.log) 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          npm run build:cli
      - name: Start OmniRoute (background)
        env:
          JWT_SECRET: ci-build-secret-with-sufficient-length-for-validation
          PORT: "20128"
        run: |
          node dist/server.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:20128/api/monitoring/health >/dev/null; then echo "server up"; exit 0; fi
            sleep 2
          done
          echo "::error::Server did not become healthy within 60 seconds"
          exit 1
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install schemathesis
        run: pip install schemathesis
      - name: Schemathesis contract fuzz (advisory)
        # Advisory gate: never fails the job. `continue-on-error` covers a crash of the
        # step itself; `|| true` covers schemathesis exiting non-zero when it finds spec
        # violations / upstream 500s — both are expected here (most /v1 endpoints proxy an
        # upstream that has no provider configured in CI). The point of the nightly is to
        # PROVE the contract is fuzzable and surface regressions, not to gate the build.
        continue-on-error: true
        run: |
          schemathesis run docs/openapi.yaml \
            --url http://localhost:20128 \
            --max-examples 20 \
            --workers 4 \
            --checks all \
            --max-response-time 30 \
            --request-timeout 30 \
            --suppress-health-check all \
            --report junit \
            --report-junit-path schemathesis-report/junit.xml \
            --no-color \
            || true
      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" || true
      - name: Upload schemathesis report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: schemathesis-report
          path: |
            schemathesis-report/
            server.log
            runner-resources.log
          if-no-files-found: warn
          retention-days: 14
