name: Nightly Resilience
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  # Exercise the changed validation jobs on the review branch before merge.
  pull_request:
    branches: ["release/v3.8.51"]
    paths:
      - ".github/workflows/nightly-resilience.yml"

permissions:
  contents: read

jobs:
  heap:
    name: Heap-growth gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:heap

  chaos:
    name: Resilience chaos (fault injection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:chaos

  k6-soak:
    name: k6 load/soak
    timeout-minutes: 40
    # Bounded V8 heap + documented webpack fallback; native Turbopack allocations
    # are not limited by --max-old-space-size. This is a mitigation, not OOM proof.
    env:
      OMNIROUTE_USE_TURBOPACK: "0"
      OMNIROUTE_BUILD_MEMORY_MB: "4096"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Runner diagnostics
        shell: bash
        run: |
          echo "runner=${{ runner.name }} environment=${{ runner.environment }} os=${{ runner.os }} arch=${{ runner.arch }}"
          echo "sha=$GITHUB_SHA run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
          free -m
          df -h .
          for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events; do
            if [ -r "$f" ]; then echo "$f"; cat "$f"; fi
          done
      - name: Build CLI bundle
        env:
          JWT_SECRET: ci-build-secret-with-sufficient-length-for-validation
          OMNIROUTE_BUILD_BACKEND_ONLY: "1"
        shell: bash
        run: |
          # Stream resource evidence before a VM shutdown can prevent artifact upload.
          (
            while true; do
              date -u
              free -m
              df -h .
              ps -eo pid,ppid,rss,comm --sort=-rss | head -n 12
              if [ -r /sys/fs/cgroup/memory.events ]; then cat /sys/fs/cgroup/memory.events; fi
              sleep 30
            done
          ) > >(tee -a runner-resources.log) 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          npm run build:cli
      - name: Start OmniRoute (background)
        env:
          JWT_SECRET: ci-build-secret-with-sufficient-length-for-validation
          PORT: "20128"
        run: |
          node dist/server.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:20128/api/monitoring/health >/dev/null; then echo "server up"; exit 0; fi
            sleep 2
          done
          echo "::error::Server did not become healthy within 60 seconds"
          exit 1
      - name: Install k6
        uses: grafana/setup-k6-action@v1
      - name: Run k6 soak
        run: k6 run --summary-export=k6-summary.json tests/load/k6-soak.js
        env:
          BASE_URL: http://localhost:20128
          SOAK_DURATION: "3m"
          SOAK_VUS: "10"
      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" || true

      - name: Upload k6 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-evidence
          path: |
            k6-summary.json
            server.log
            runner-resources.log
          retention-days: 14

  a11y:
    name: A11y axe (nightly, freeze-and-alert)
    # Keep the operator's VPS selection; hosted fallback uses bounded webpack builds.
    runs-on: ${{ (github.event_name != 'pull_request' && vars.USE_VPS_RUNNER == 'true' && fromJSON('["self-hosted","omni-light"]')) || 'ubuntu-latest' }}
    # Build the full dashboard explicitly, then let Playwright boot that exact output.
    # REQUIRE_AXE keeps real page analysis and the missing-dependency meta-test active.
    timeout-minutes: 50
    # Bounded V8 heap + documented webpack fallback; native Turbopack allocations
    # are not limited by --max-old-space-size. This is a mitigation, not OOM proof.
    env:
      OMNIROUTE_USE_TURBOPACK: "0"
      OMNIROUTE_BUILD_MEMORY_MB: "4096"
      JWT_SECRET: ci-test-secret-with-sufficient-length-for-validation
      API_KEY_SECRET: ci-test-api-key-secret-long
      DISABLE_SQLITE_AUTO_BACKUP: "true"
      REQUIRE_AXE: "1"
      PLAYWRIGHT_JUNIT_OUTPUT_FILE: a11y-junit.xml
      # Own a port the rest of the box cannot steal. This job ran on the default
      # 20128 and failed 9 of 10 nights two ways: "http://localhost:20128/
      # api/monitoring/health is already used" when the deployed server (or a
      # concurrent runner job) answered first (runs 35688196787, 35562389397),
      # and a 900 s webServer timeout under listener contention (run
      # 35819784314). DASHBOARD_PORT drives playwright.config's readiness URL,
      # PORT drives the server the webServer script boots — both set, same value.
      DASHBOARD_PORT: "21777"
      PORT: "21777"
      # Server readiness remains bounded independently of the explicit build step.
      OMNIROUTE_PLAYWRIGHT_WEB_SERVER_TIMEOUT: "1800000"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Runner diagnostics
        shell: bash
        run: |
          echo "runner=${{ runner.name }} environment=${{ runner.environment }} os=${{ runner.os }} arch=${{ runner.arch }}"
          echo "sha=$GITHUB_SHA run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
          free -m
          df -h .
          for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events; do
            if [ -r "$f" ]; then echo "$f"; cat "$f"; fi
          done
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      # Full UI build: backend-only stubs would invalidate page accessibility tests.
      - name: Build dashboard for axe
        shell: bash
        run: |
          # Stream resource evidence before a VM shutdown can prevent artifact upload.
          (
            while true; do
              date -u
              free -m
              df -h .
              ps -eo pid,ppid,rss,comm --sort=-rss | head -n 12
              if [ -r /sys/fs/cgroup/memory.events ]; then cat /sys/fs/cgroup/memory.events; fi
              sleep 30
            done
          ) > >(tee -a runner-resources.log) 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          npm run build
      - name: Run axe a11y suite
        env:
          OMNIROUTE_PLAYWRIGHT_SKIP_BUILD: "1"
        run: npx playwright test tests/e2e/a11y.spec.ts --reporter=line,junit
      - name: Upload A11y evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-evidence
          path: |
            a11y-junit.xml
            test-results/
            runner-resources.log
          retention-days: 14
